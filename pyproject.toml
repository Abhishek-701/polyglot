[project]
name = "polyglot"
version = "0.1.0"
description = "Real-time cross-lingual voice agent with a deterministic evaluation harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "faster-whisper>=1.2.1,<2",
    "silero-vad>=6.2.2,<7",
    "fasttext-wheel>=0.9.2,<1",
    "jiwer>=3",
    "datasets>=2.20",
    "requests>=2.31",
    "sentence-transformers>=6",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pypdf>=5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "types-PyYAML>=6",
    "hypothesis>=6.100",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "polyglot.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: requires pre-downloaded model weights/data (scripts/download_datasets.py); skipped by default and in CI",
]
addopts = "-m 'not network'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyglot"]
